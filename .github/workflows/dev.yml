name: dev

on:
  push:
    branches:
      - 'Dev_FB'

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - run: rm -rf $GITHUB_WORKSPACE/*
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: npm ci
            - run: npm run lint
            - run: rm -rf $GITHUB_WORKSPACE/*
    log-check:
        runs-on: ubuntu-latest
        steps:
            - run: rm -rf $GITHUB_WORKSPACE/*
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Fail on checked-in console.log
              run: |
               set -euo pipefail
               matches=$(git grep -n --full-name -E "console\.log\s*\(" -- ':!node_modules' ':!dist' ':!build' ':!coverage' || true)
               if [ -n "$matches" ]; then
                 echo "ERROR: console.log usages found in checked-in files:"
                 echo "$matches"
                 exit 1
               fi
            - run: rm -rf $GITHUB_WORKSPACE/*
    build:
        runs-on: ubuntu-latest
        needs: 
          - lint
        steps:
            - run: rm -rf $GITHUB_WORKSPACE/*
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: npm ci
            - run: npm run build
            - run: rm -rf $GITHUB_WORKSPACE/*