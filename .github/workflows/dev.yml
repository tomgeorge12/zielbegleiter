name: dev

on:
  push:
    branches:
      - 'Dev_FB'

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - run: rm -rf $GITHUB_WORKSPACE/*
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - run: npm ci
            - run: npm run lint
            - run: rm -rf $GITHUB_WORKSPACE/*
